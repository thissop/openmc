# Conda environment for the conformal stellarator SPF neutronics pipeline on
# x86_64 (e.g. Columbia Ginsburg). conda-forge ships OpenMC built WITH DAGMC on
# linux-64 (it is NOT available on linux-aarch64, which is why the sandbox cannot
# run transport). One `conda env create -f environment.yml` gives the full stack.
#
#   conda env create -f environment.yml
#   conda activate spf-stellarator
#
# DESC is intentionally NOT here: it pulls its own jax/numpy pins that conflict
# with OpenMC. Keep DESC in a SEPARATE env (see RUN_ON_GINSBURG.md) -- it only
# WRITES field maps (producer/consumer split).
#
# Versions are pinned to a known-consistent conda-forge set; bump as needed but
# re-run the smoke tests (RUN_ON_GINSBURG.md) after any change.
name: spf-stellarator
channels:
  - conda-forge
  - nodefaults        # force conda-forge ONLY (avoids Anaconda 'defaults' ToS gates;
                      # Ginsburg's base conda is configured with defaults only)
dependencies:
  - python=3.11
  # --- transport stack. Pin the DAGMC build variant explicitly so the solver
  #     never picks the nodagmc build (openmc pulls dagmc + moab as deps). ---
  - openmc=0.15.*=dagmc*
  - dagmc
  - moab            # also the make_watertight backend used by stl_to_h5m
  # --- scientific stack (match the sandbox spf_venv) ---
  - numpy
  - scipy
  - sympy
  - h5py
  - pandas
  - matplotlib
  - pytest
  - cmake
  - cxx-compiler
  # --- analytic free-streaming cross-check (Part A rigor anchor) ---
  - jax
  - jaxlib
  - pip
  - pip:
      # STL -> DAGMC .h5m (cad_to_dagmc does NOT read STL; it ingests STEP only).
      - stl_to_h5m
      - smplotlib
      # anarrima (Schwartz analytic NWL) -- not on PyPI; pin a known commit so a
      # `conda env create` cannot break on an upstream change:
      - "git+https://github.com/PrincetonUniversity/anarrima.git@2a578161244e33a920f626b5504d3f31f25cc816"
